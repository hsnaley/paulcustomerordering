<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeamGrassroots · Option 3 (Clubhouse)</title>
<meta name="description" content="Clickable prototype of the TeamGrassroots intranet, CRM and order management system.">
<style>
:root{
  --pitch:#0f3d2e; --pitch-2:#14523d; --lime:#8ac926; --lime-ink:#3f6212;
  --ink:#0d1420; --body:#3d4a5c; --muted:#6b7889; --line:#e3e8ef; --line-2:#eef2f7;
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#fafbfd;
  --amber:#f59e0b; --red:#e5484d; --blue:#2f6feb;
  --r:10px; --shadow:0 1px 2px rgba(13,20,32,.05),0 8px 24px -12px rgba(13,20,32,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--body);background:var(--bg);-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{color:var(--ink);margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}h4{font-size:13px}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--pitch);color:#cfe3d8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px}
.crest{width:32px;height:32px;border-radius:8px;background:linear-gradient(150deg,var(--lime),#4d9e2a);
  display:grid;place-items:center;color:#0b2b1f;font-weight:800;font-size:13px;flex:none}
.brand b{color:#fff;font-size:14.5px;display:block;line-height:1.15}
.brand span{font-size:11px;color:#7fa898;letter-spacing:.03em;text-transform:uppercase}
.nav{padding:6px 10px;overflow:auto;flex:1}
.nav .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#6d9384;padding:14px 8px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13.5px;color:#cfe3d8;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:var(--lime);color:#12301f;font-weight:600}
.nav a .ico{width:16px;text-align:center;opacity:.9;font-size:13px}
.nav a .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:20px}
.nav a.on .cnt{background:rgba(0,0,0,.14)}
.side .who{border-top:1px solid rgba(255,255,255,.1);padding:12px 16px;display:flex;gap:10px;align-items:center}
.side .who .avm{width:28px;height:28px;border-radius:50%;background:#2b6b52;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.side .who b{color:#fff;font-size:12.5px;display:block}
.side .who span{font-size:11px;color:#7fa898}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 22px;display:flex;gap:14px;align-items:center}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.search input:focus{outline:none;border-color:var(--pitch-2);background:#fff;box-shadow:0 0 0 3px rgba(20,82,61,.09)}
.search .mag{position:absolute;left:11px;top:9px;color:var(--muted);font-size:13px}
.res{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);max-height:340px;overflow:auto;display:none;z-index:30}
.res.on{display:block}
.res .r{padding:9px 12px;border-bottom:1px solid var(--line-2);cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13px}
.res .r:hover{background:var(--surface-2)}
.res .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;flex:none}
.top .spacer{flex:1}
.chip{font-size:11.5px;color:var(--muted);border:1px dashed var(--line);border-radius:20px;padding:4px 11px}

.page{padding:22px;max-width:1420px;width:100%}
.phead{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.phead p{margin:4px 0 0;color:var(--muted);font-size:13px}
.phead .actions{margin-left:auto;display:flex;gap:8px}

.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 13px;font-size:13px;font-weight:550}
.btn:hover{border-color:#cdd6e2;background:var(--surface-2)}
.btn.pri{background:var(--pitch);border-color:var(--pitch);color:#fff}
.btn.pri:hover{background:var(--pitch-2)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#1b3a13}
.btn.sm{padding:5px 10px;font-size:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card .hd{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card .hd .actions{margin-left:auto;display:flex;gap:6px}
.card .bd{padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:2fr 1fr}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2,.g21{grid-template-columns:1fr}}

.kpi{padding:14px 16px}
.kpi .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .val{font-size:25px;font-weight:700;color:var(--ink);letter-spacing:-.02em;margin-top:4px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .sub b.up{color:#177245}.kpi .sub b.dn{color:var(--red)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  padding:9px 14px;border-bottom:1px solid var(--line);font-weight:600;background:var(--surface-2)}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:middle}
tr.click:hover{background:var(--surface-2);cursor:pointer}
td b{color:var(--ink);font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.t-grey{background:#eef1f5;color:#5b6675}.t-blue{background:#e7efff;color:#1e4fbf}
.t-amber{background:#fdf1dc;color:#96620d}.t-green{background:#e3f6e9;color:#177245}
.t-red{background:#fdeaea;color:#b3282c}.t-violet{background:#efeaff;color:#5a3ee0}
.t-teal{background:#dcf5f1;color:#0b6d63}

.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:1 0 232px;background:#eff2f6;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 220px)}
.col .ch{padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:#eff2f6;border-radius:10px 10px 0 0}
.col .ch b{font-size:12.5px;color:var(--ink)}
.col .ch .n{margin-left:auto;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 7px;color:var(--muted)}
.col .cb{padding:8px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:80px}
.col.over .cb{background:#e6f0e9}
.ocard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;cursor:grab;box-shadow:0 1px 2px rgba(13,20,32,.05)}
.ocard:hover{border-color:#c6d2e0;box-shadow:var(--shadow)}
.ocard.drag{opacity:.45}
.ocard .ref{font-size:10.5px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
.ocard .cn{font-size:13.5px;font-weight:650;color:var(--ink);margin:3px 0 5px;line-height:1.3}
.ocard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:7px}
.av{width:22px;height:22px;border-radius:50%;background:var(--pitch-2);color:#fff;display:grid;place-items:center;font-size:9.5px;font-weight:700;flex:none}
.stagepath{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted)}
.stagepath i{font-style:normal;padding:3px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.stagepath i.done{background:#e3f6e9;border-color:#bfe6cd;color:#177245}
.stagepath i.now{background:var(--pitch);border-color:var(--pitch);color:#fff;font-weight:600}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tabs button{background:none;border:none;padding:9px 13px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--pitch)}
.kv{display:grid;grid-template-columns:132px 1fr;gap:7px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;color:var(--ink)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.feed li:last-child{border:0}
.feed .t{margin-left:auto;color:var(--muted);font-size:11.5px;white-space:nowrap}
.note{background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:8px}
.note .m{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--pitch-2);box-shadow:0 0 0 3px rgba(20,82,61,.09)}
.totals{font-size:13.5px}
.totals .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line-2)}
.totals .row.big{border:0;padding-top:11px;font-size:18px;font-weight:700;color:var(--ink)}
.art{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.art .ph{height:96px;display:grid;place-items:center;font-size:26px;background:repeating-conic-gradient(#f4f6f9 0% 25%,#eaeef4 0% 50%) 50%/16px 16px}
.art .m{padding:9px 10px;font-size:12px}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.hint{background:#fffbeb;border:1px solid #fde68a;color:#8a5a06;border-radius:9px;padding:10px 13px;font-size:12.5px;margin-bottom:16px}
.bcrumb{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.bcrumb a{color:var(--pitch-2);font-weight:600;cursor:pointer}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.bars{display:flex;flex-direction:column;gap:9px}
.bars .b{font-size:12.5px}
.bars .b .r{display:flex;justify-content:space-between;margin-bottom:3px}
.bars .b .tr{height:7px;background:var(--line-2);border-radius:9px;overflow:hidden}
.bars .b .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--pitch-2),var(--lime))}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:9px;font-size:13px;opacity:0;transition:.25s;z-index:99;box-shadow:var(--shadow);pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.prose{max-width:900px}
.prose p{line-height:1.65}
.prose ul{padding-left:18px;line-height:1.75}
.phase{border-left:3px solid var(--lime);padding-left:14px;margin-bottom:22px}
.price{font-size:20px;font-weight:700;color:var(--ink)}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.nav{display:flex;gap:4px;flex-wrap:wrap}.nav .lbl,.side .who{display:none}}
</style>

<style>
/* Option 3 - Clubhouse rail.
   Menu collapses to icons so the screen belongs to the work, and opens when you reach for it.
   Navy rail, serif headings borrowed from matchday programmes, generous spacing. */
:root{--pitch:#10254d;--pitch-2:#1863DC;--lime:#1863DC;--bg:#f4f7fc;--line:#e4e9f2;--r:18px}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:600;letter-spacing:-.005em}
h1{font-size:27px}
.app{grid-template-columns:80px 1fr}
.main{grid-column:2}
.side{background:#10254d;position:fixed;top:0;bottom:0;left:0;width:80px;height:100vh;overflow:hidden;
  transition:width .2s cubic-bezier(.4,0,.2,1);z-index:40}
.side:hover{width:244px;box-shadow:18px 0 46px -22px rgba(10,26,60,.55)}
.brand{display:flex;align-items:center;gap:12px;padding:20px 23px 16px}
.tgmark{width:34px;height:34px;border-radius:11px;background:#1863DC;color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:13px;flex:none;font-family:inherit}
.tglogo{width:118px;opacity:0;transition:opacity .2s;flex:none}
.side:hover .tglogo{opacity:1}
.nav{padding:4px 0}
.nav .lbl{opacity:0;height:0;padding:0;overflow:hidden;transition:opacity .18s}
.side:hover .nav .lbl{opacity:1;height:auto;padding:15px 24px 6px}
.nav a{font-size:0;gap:0;padding:11px 10px;margin:2px 14px;border-radius:12px;color:#a9bcd8;overflow:hidden;white-space:nowrap}
.nav a .ico{font-size:16.5px;width:32px;text-align:center;flex:none;opacity:1}
.side:hover .nav a{font-size:13.5px;gap:9px}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{background:#1863DC;color:#fff;font-weight:600}
.nav a .cnt{font-size:11px;opacity:0;transition:opacity .18s;background:rgba(255,255,255,.18)}
.side:hover .nav a .cnt{opacity:1}
.side .who{opacity:0;transition:opacity .18s;border-top:1px solid rgba(255,255,255,.12);white-space:nowrap}
.side:hover .who{opacity:1}
.side .who .avm{background:#1863DC}
.side .who span{color:#8fa6c6}
.top{background:rgba(255,255,255,.94);padding:13px 30px}
.search input{border-radius:12px;padding-top:10px;padding-bottom:10px}
.page{padding:30px 32px}
.phead{margin-bottom:22px}
.card{border-radius:18px;border-color:#e4e9f2;box-shadow:0 2px 4px rgba(16,37,77,.04),0 20px 44px -28px rgba(16,37,77,.32)}
.card .hd{padding:16px 20px}
.card .bd{padding:20px}
.kpi{padding:18px 20px}
.kpi .lab{font-size:11px;letter-spacing:.08em}
.kpi .val{font-family:Georgia,"Iowan Old Style",serif;font-size:32px;margin-top:6px}
th{padding:10px 20px;background:#fbfcfe}
td{padding:13px 20px}
.btn{border-radius:11px;padding:9px 15px}
.btn.pri{background:#1863DC;border-color:#1863DC}
.btn.pri:hover{background:#0f4fb8}
.tag{border-radius:7px;padding:4px 10px}
.col{background:#e7edf9;border-color:#d8e2f3;border-radius:16px;flex:1 0 236px}
.col .ch{background:#e7edf9;border-radius:16px 16px 0 0;border-bottom-color:#d8e2f3;padding:12px 14px}
.ocard{border-radius:13px;padding:13px;border-color:#e4e9f2}
.ocard .cn{font-size:14px}
.av{background:#1863DC}
.stagepath i{border-radius:8px}
.stagepath i.now{background:#1863DC;border-color:#1863DC}
.stagepath i.done{background:#e7efff;border-color:#c9dcff;color:#0f4fb8}
.bars .b .tr i{background:linear-gradient(90deg,#10254d,#1863DC)}
.tabs button.on{border-bottom-color:#1863DC}
.note,.hint{border-radius:12px}
@media(max-width:860px){.app{grid-template-columns:1fr}.main{grid-column:1}.side{position:static;width:100%;height:auto}
  .side .nav a{font-size:13.5px}.tglogo{opacity:1}.side .who{opacity:1}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="tgmark">TG</div>
      <img class="tglogo" src="tg-logo.png" alt="TeamGrassroots">
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="who">
      <div class="avm">SH</div>
      <div><b>Sam Hardy</b><span>Sales &amp; Admin</span></div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="search">
        <span class="mag">&#9906;</span>
        <input id="q" placeholder="Search club, contact, order, quote, invoice or SKU…" autocomplete="off">
        <div class="res" id="res"></div>
      </div>
      <div class="spacer"></div>
      <span class="chip">Prototype · sample data · nothing is saved</span>
    </header>
    <div class="page" id="page"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
